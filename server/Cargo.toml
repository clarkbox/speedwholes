[package]
name = "speedwholes"
version = "0.1.0"
edition = "2021"
description = "Fast image resizing and caching HTTP service"
license = "MIT"

[dependencies]
# Web framework
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "catch-panic", "set-header"] }

# TLS crypto provider (required by rustls)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Image processing
image = "0.25"
imagesize = "0.13"
fast_image_resize = "6"
turbojpeg = { version = "1", features = ["image"] }

# Lossy WebP encoding via libwebp (fast C library)
libwebp-sys = "0.14"

# HTTP client for fetching remote images (rustls for static builds)
reqwest = { version = "0.12", default-features = false, features = [
    "stream",
    "rustls-tls",
    "gzip",
    "brotli",
] }

# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# JSON serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing for cache keys
sha2 = "0.10"
hex = "0.4"

# URL signing (HMAC-SHA256)
hmac = "0.12"
base64 = "0.22"
subtle = "2.5"

# LRU cache for signature verification
lru = "0.18"

# UUID for session tokens
uuid = { version = "1", features = ["v4"] }

# Error handling
thiserror = "1"

# URL parsing
url = "2"
percent-encoding = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Async utilities
futures = "0.3"

# Sync primitives
parking_lot = "0.12"

# Time/date handling
chrono = "0.4"

# Process management (Unix signals for PID checking)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "fs"] }

[dev-dependencies]
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
# Temp directories for cache tests
tempfile = "3.14"
# In-process HTTP tests
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
crc32fast = "1"

[[bench]]
name = "image_processing"
harness = false

[profile.release]
opt-level = 3
lto = true
