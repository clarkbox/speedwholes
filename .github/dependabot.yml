version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /www
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
